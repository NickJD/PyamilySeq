[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyamilySeq"
version = "1.5.0"
authors = [
    {name = "Nicholas Dimonaco", email = "nicholas@dimonaco.co.uk"}
]
description = "Build and analyze gene families and pangenomes from CD-HIT, DIAMOND, BLAST, or MMseqs2 clustering results."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["Pangenomics", "Sequence Clustering", "Gene Families"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "levenshtein>=0.27.3"
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/NickJD/PyamilySeq"
"Bug Tracker" = "https://github.com/NickJD/PyamilySeq/issues"

[project.scripts]
    PyamilySeq = "PyamilySeq.PyamilySeq:main"
    pyamilyseq = "PyamilySeq.PyamilySeq:main"
    Seq-Combiner = "PyamilySeq.Seq_Combiner:main"
    seq-combiner = "PyamilySeq.Seq_Combiner:main"
    Group-Splitter = "PyamilySeq.Group_Splitter:main"
    group-splitter = "PyamilySeq.Group_Splitter:main"
    Group-Extractor = "PyamilySeq.Group_Extractor:main"
    group-extractor = "PyamilySeq.Group_Extractor:main"
    Group-Summary = "PyamilySeq.Group_Summary:main"
    group-summary = "PyamilySeq.Group_Summary:main"
    Seq-Finder = "PyamilySeq.Seq_Finder:main"
    seq-finder = "PyamilySeq.Seq_Finder:main"
    Seq-Extractor = "PyamilySeq.Seq_Extractor:main"
    seq-extractor = "PyamilySeq.Seq_Extractor:main"
    Group-Compare = "PyamilySeq.Group_Compare:main"
    group-compare = "PyamilySeq.Group_Compare:main"
    Group-Sizes = "PyamilySeq.Group_Sizes:main"
    group-sizes = "PyamilySeq.Group_Sizes:main"
    Track-Family-Locations = "PyamilySeq.location_tracking:run_from_cli"
    track-family-locations = "PyamilySeq.location_tracking:run_from_cli"
    Track-Genome-Order = "PyamilySeq.order_analysis:main"
    track-genome-order = "PyamilySeq.order_analysis:main"
    PyamilySeq-Cohort = "PyamilySeq.cohort_analysis:main"
    pyamilyseq-cohort = "PyamilySeq.cohort_analysis:main"
    PyamilySeq-Validate = "PyamilySeq.validation:run_from_cli"
    pyamilyseq-validate = "PyamilySeq.validation:run_from_cli"
    PyamilySeq-Query = "PyamilySeq.genome_reports:main"
    pyamilyseq-query = "PyamilySeq.genome_reports:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["PyamilySeq*"]

[tool.setuptools.package-data]
PyamilySeq = [
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 120
